<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍓 Sisyphus Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-v3.css') }}">
</head>
<body>
<div class="main-container">
  <div class="header">
    <div class="header-top">
      <h1 id="dashboardTitle">{% if user_role == 'admin' %}ADMIN SISYPHUS DASHBOARD{% else %}SISYPHUS DASHBOARD{% endif %}</h1>
      <div class="header-actions">
        <button id="shutdownBtn" class="shutdown-btn" onclick="confirmShutdown()" style="display: none;">
          <i class="fas fa-power-off"></i>
          <span>Shutdown</span>
        </button>
        <button id="logoutBtn" class="logout-btn" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </div>
    <div class="status-bar">
      <div class="status-badge">
        <i class="fas fa-server"></i>
        <span id="hostnameDisplay">Pi5 Server</span>
      </div>
      <div class="status-badge" id="diskBadge">
        <i class="fas fa-hdd"></i>
        <span id="diskDisplay">Disk: --%</span>
      </div>
      <div class="status-badge" id="memBadge">
        <i class="fas fa-memory"></i>
        <span id="memDisplay">RAM: --%</span>
      </div>
      <div class="status-badge" id="tempBadge">
        <i class="fas fa-thermometer-half"></i>
        <span id="tempDisplay">--°C</span>
      </div>
      <div class="status-badge" id="uptimeBadge">
        <i class="fas fa-clock"></i>
        <span id="uptimeDisplay">--:--:--:--</span>
      </div>
    </div>
  </div>
  
  <div class="grid-container">
    <!-- CPU Performance Card (Large - Left) -->
    <div class="card card-large">
      <div class="card-header">
        <h2>
          <div class="card-icon cpu-icon"><i class="fas fa-microchip"></i></div>
          CPU Performance
        </h2>
        <div class="metric-value" id="cpuOverall">--% Overall</div>
      </div>
      <div class="card-content">
        <div class="stats-list" id="cpuCoresList">
          <!-- CPU cores will be dynamically populated -->
        </div>
      </div>
    </div>
    
    <!-- Portainer Management Card (Small - Right) -->
    <div class="card card-small">
      <div class="card-header">
        <h2>
          <div class="card-icon docker-icon"><i class="fab fa-docker"></i></div>
          Portainer
        </h2>
        <button class="metric-value portainer-link-btn" onclick="openPortainer()">
          <i class="fas fa-external-link-alt"></i>
        </button>
      </div>
      <div class="card-content">
        <div class="stats-list" id="containerStats">
          <div class="stat-item">
            <div class="stat-label">
              <span><i class="fas fa-play"></i> Running</span>
              <span class="stat-value" id="containersRunning">-- </span>
            </div>
          </div>
          <div class="stat-item">
            <div class="stat-label">
              <span><i class="fas fa-box"></i> Total</span>
              <span class="stat-value" id="containersTotal">-- </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- System Network Card (Small - Bottom Right) -->
    <div class="card card-small">
      <div class="card-header">
        <h2>
          <div class="card-icon network-icon"><i class="fas fa-network-wired"></i></div>
          Network Activity
        </h2>
        <div class="metric-value" id="networkStatus">Active</div>
      </div>
      <div class="card-content">
        <div class="stats-list" id="networkList">
          <div class="stat-item">
            <div class="stat-label">
              <span><i class="fas fa-download"></i> Download</span>
              <span class="stat-value" id="networkRx">-- MB</span>
            </div>
          </div>
          <div class="stat-item">
            <div class="stat-label">
              <span><i class="fas fa-upload"></i> Upload</span>
              <span class="stat-value" id="networkTx">-- MB</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='script-v3.js') }}"></script>
</body>
</html>
